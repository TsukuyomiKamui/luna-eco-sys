services:
  # 1. База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: luna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-luna_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luna_password}
      POSTGRES_DB: ${DB_NAME:-luna_db}
    ports:
      - "5432:5432" # Прокидываем порт, чтобы можно было подключиться через pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data # Данные не удалятся при перезапуске контейнера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. In-Memory кэш Redis
  redis:
    image: redis:7-alpine
    container_name: luna-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. Наш модульный монолит (Бэкенд)
  luna-backend:
    build: .
    container_name: luna-backend
    restart: on-failure
    ports:
      - "8080:8080" # API будет доступно на http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Перезаписываем настройки из application.yml, чтобы они смотрели на соседние контейнеры
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-luna_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-luna_admin}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-luna_password}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-ChangeThisSecretBeforeProductionLunaRestaurant2026!}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-admin123}

# Объявляем физическое хранилище на диске для БД
volumes:
  postgres_data:
